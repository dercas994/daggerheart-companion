# Costruisce l'APK Android e lo pubblica nella release "apk-latest".
# L'app carica il sito online (capacitor.config.json → server.url), quindi l'APK
# va ricostruito solo quando cambia la parte nativa: icona, plugin, configurazione.
# Il numero di build diventa il versionCode: l'app lo confronta con la release
# e, se ce n'è uno più nuovo, propone di scaricare l'aggiornamento.
name: APK Android
on:
  push:
    branches: [main]
    paths:
      - capacitor.config.json
      - assets/**
      - package.json
      - .github/workflows/android.yml
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Icone dell'app
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#16111F' --splashBackgroundColor '#16111F'
      - name: Numero di versione
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk daggerheart-companion.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: App Android (build ${{ github.run_number }})
          body: |
            Scarica l'APK sul telefono e aprilo per installarlo (consenti l'installazione da origini sconosciute).
            Le novità del sito arrivano nell'app da sole; questa build serve solo per icona e parte Android.
          files: daggerheart-companion.apk
          make_latest: true
