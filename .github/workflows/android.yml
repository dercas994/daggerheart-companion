# Costruisce l'APK Android e lo allega a una release scaricabile
name: APK Android
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - run: npx cap add android && npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk daggerheart-companion.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: App Android (ultima versione)
          body: Scarica l'APK sul telefono e aprilo per installarlo (consenti l'installazione da origini sconosciute).
          files: daggerheart-companion.apk
          make_latest: true
